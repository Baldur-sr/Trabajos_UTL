<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightmare Foxy - Minecraft Skin</title>
    <link rel="stylesheet" href="estilos1.css">
</head>
<body>
    <div class="lienzo-minecraft">
        
        <div class="personaje-mc">
            
            <!-- Orejas blocky -->
            <div class="orejas">
                <div class="oreja izq-metal"></div>
                <div class="oreja der-roja"></div>
            </div>

            <!-- Cabeza (Proporción 8x8) -->
            <div class="cabeza">
                <!-- Daño en la cabeza revelando el endoesqueleto -->
                <div class="dano-craneo"></div>
                
                <div class="ojos">
                    <div class="ojo oscuro"></div>
                    <div class="ojo brillante">
                        <div class="pupila-fuego"></div>
                    </div>
                </div>

                <!-- Hocico sobresaliente simulado con sombras -->
                <div class="hocico">
                    <div class="nariz-pixel"></div>
                    <div class="mandibula-pesadilla">
                        <div class="dientes-bloque"></div>
                        <div class="dientes-bloque abajo"></div>
                    </div>
                </div>
            </div>

            <div class="cuerpo-contenedor">
                <!-- Brazo Derecho (Garfio) - Proporción 4x12 -->
                <div class="brazo derecho">
                    <div class="hombro-rojo"></div>
                    <div class="antebrazo-endo"></div>
                    <div class="garfio-pixel"></div>
                </div>

                <!-- Torso (Proporción 8x12) -->
                <div class="torso">
                    <!-- Agujero gigante en el pecho con costillas metálicas -->
                    <div class="pecho-roto">
                        <div class="costilla-endo"></div>
                        <div class="costilla-endo"></div>
                        <div class="costilla-endo"></div>
                    </div>
                    <div class="cintura-rota"></div>
                </div>

                <!-- Brazo Izquierdo - Proporción 4x12 -->
                <div class="brazo izquierdo">
                    <div class="hombro-rojo"></div>
                    <div class="brazo-roto"></div>
                    <div class="mano-endo"></div>
                </div>
            </div>

            <div class="piernas-contenedor">
                <!-- Pierna Derecha - Proporción 4x12 -->
                <div class="pierna derecha">
                    <div class="pantalon-roto"></div>
                    <div class="pierna-endo"></div>
                    <div class="pie-metal"></div>
                </div>

                <!-- Pierna Izquierda - Proporción 4x12 -->
                <div class="pierna izquierda">
                    <div class="pantalon-roto"></div>
                    <div class="pierna-endo"></div>
                    <div class="pie-metal"></div>
                </div>
            </div>

            <!-- Capa superpuesta para dar la textura de píxeles de Minecraft -->
            <div class="textura-pixeles"></div>
        </div>

    </div>
</body>
</html>
